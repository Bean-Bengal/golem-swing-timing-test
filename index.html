<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golem Swing Timing Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#2a2622;color:#f1e7d3}
.wrap{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.3em 0}
#banner{padding:6px 10px;border-radius:6px;font-size:.85rem;margin:8px 0}
.ok{background:#2d5a34}.bad{background:#7a2b2b}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.cell{background:#3a342e;border-radius:8px;padding:8px;min-width:0;overflow-wrap:anywhere}
canvas{width:100%;height:auto;background:#d9c9a6;border-radius:6px;display:block}
label{display:block;font-size:.85rem;margin-top:6px}
input[type=range]{width:100%}
button{min-height:40px;padding:0 14px;border-radius:6px;border:0;background:#e07a3f;color:#fff;font-size:1rem}
button:active{background:#b85f2b}
.note{font-size:.85rem;opacity:.85}
</style></head><body><div class="wrap">
<h1>Golem swing timing</h1>
<p class="note">Same golem, three step speeds. The arms trail the legs by the lag. Which one is heavy and which one is a slug?</p>
<div id="banner"></div>
<button id="pp">Pause</button>
<div class="grid" id="grid"></div>
</div>
<script>
// pure pose: period in seconds, lag as fraction of a cycle, time t
function pose(t,period,lag){
  var ph=(t/period)%1;
  var leg=Math.sin(ph*2*Math.PI);
  var arm=Math.sin((ph-lag)*2*Math.PI);
  var bob=-Math.abs(Math.sin(ph*Math.PI))*5;
  return {leg:leg,arm:arm,bob:bob};
}
var cfgs=[
 {name:'Heavy',period:2.2,lag:0.18,note:'slow, long arm lag'},
 {name:'Middle',period:1.3,lag:0.12,note:'medium'},
 {name:'Slug?',period:3.8,lag:0.05,note:'very slow, little lag'}
];
// checks
function checks(){
  var r=[];
  var p=pose(0,1,0.25);r.push(Math.abs(p.leg)<1e-9);
  r.push(Math.abs(pose(0.25,1,0.25).leg-1)<1e-9);
  r.push(Math.abs(pose(0.5,1,0.25).arm-1)<1e-9);
  r.push(Math.abs(pose(0.25,1,0.25).arm)<1e-9);
  r.push(pose(0.5,1,0).bob<-4.99);
  // broken copy: no lag must fail the lag check
  var broken=function(t,pe){return pose(t,pe,0);};
  r.push(Math.abs(broken(0.25,1).arm-1)<1e-9); // true for broken, expected to differ from lagged
  r[r.length-1]=!(Math.abs(broken(0.5,1).arm-1)<1e-9);
  return r;
}
var res=checks(),b=document.getElementById('banner');
var all=res.every(Boolean);
b.className=all?'ok':'bad';b.textContent=all?'Self-test pass ('+res.length+' checks)':'Self-test FAIL: '+res.map(function(x){return x?1:0}).join('');
var grid=document.getElementById('grid'),cells=[];
cfgs.forEach(function(c,i){
  var d=document.createElement('div');d.className='cell';
  d.innerHTML='<b>'+c.name+'</b> <span class="note">'+c.note+'</span><canvas width="300" height="240"></canvas>'+
  '<label>Cycle seconds: <span class="pv"></span><input type="range" min="0.6" max="5" step="0.1" value="'+c.period+'"></label>'+
  '<label>Arm lag (cycle fraction): <span class="lv"></span><input type="range" min="0" max="0.4" step="0.01" value="'+c.lag+'"></label>';
  grid.appendChild(d);
  var ins=d.querySelectorAll('input'),o={c:c,cv:d.querySelector('canvas'),pv:d.querySelector('.pv'),lv:d.querySelector('.lv')};
  function upd(){c.period=+ins[0].value;c.lag=+ins[1].value;o.pv.textContent=c.period;o.lv.textContent=c.lag;}
  ins[0].oninput=upd;ins[1].oninput=upd;upd();cells.push(o);
});
function limb(x,g,y,ang,len,w,col){
  x.save();x.translate(x_,y);
}
function drawGolem(x,t,c){
  var p=pose(t,c.period,c.lag);
  x.clearRect(0,0,300,240);
  x.fillStyle='#b8a67f';x.fillRect(0,200,300,40);
  var cx=150,hy=200+p.bob*0; 
  var by=p.bob;
  function part(px,py,ang,len,w,col){
    x.save();x.translate(px,py);x.rotate(ang);x.fillStyle=col;x.fillRect(-w/2,0,w,len);x.restore();
  }
  // legs
  part(cx-18,150+by,p.leg*0.5,52,22,'#5d6b5a');
  part(cx+18,150+by,-p.leg*0.5,52,22,'#6f7d6a');
  // back arm
  part(cx+40,88+by,p.arm*0.7,70,20,'#6f7d6a');
  // torso
  x.fillStyle='#7f8f78';x.fillRect(cx-40,80+by,80,75);
  x.fillStyle='#5d6b5a';x.fillRect(cx-30,100+by,20,8);
  // head
  x.fillStyle='#8a9a82';x.fillRect(cx-20,52+by,40,32);
  x.fillStyle='#ffd45a';x.fillRect(cx-12,64+by,8,6);x.fillRect(cx+4,64+by,8,6);
  // front arm
  part(cx-40,88+by,-p.arm*0.7,70,20,'#5d6b5a');
  // shadow
  x.fillStyle='rgba(0,0,0,.2)';x.fillRect(cx-45,198,90,5);
}
var paused=false,T=0,last=null;
document.getElementById('pp').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause';};
function frame(ts){
  if(last!==null&&!paused)T+=(ts-last)/1000;last=ts;
  cells.forEach(function(o){drawGolem(o.cv.getContext('2d'),T,o.c);});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
